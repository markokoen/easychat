<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="920" viewBox="0 0 1400 920" role="img" aria-labelledby="title desc">
  <title id="title">EasyChat Clean Architecture</title>
  <desc id="desc">Modern clean layered architecture diagram for EasyChat with non-overlapping sections.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fbff"/>
      <stop offset="100%" stop-color="#eef3ff"/>
    </linearGradient>

    <linearGradient id="interfaces" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="application" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="domain" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#16a34a"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="infrastructure" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9333ea"/>
      <stop offset="100%" stop-color="#d946ef"/>
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#334155" flood-opacity="0.18"/>
    </filter>

    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#475569"/>
    </marker>

    <style>
      .h1 { font: 800 50px 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
      .sub { font: 500 22px 'Segoe UI', Arial, sans-serif; fill: #334155; }
      .chip { font: 700 15px 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
      .layer { font: 800 30px 'Segoe UI', Arial, sans-serif; fill: #ffffff; }
      .item { font: 600 19px 'Segoe UI', Arial, sans-serif; fill: #eef2ff; }
      .rule { font: 600 18px 'Segoe UI', Arial, sans-serif; fill: #334155; }
    </style>
  </defs>

  <rect width="1400" height="920" fill="url(#bg)"/>
  <circle cx="1240" cy="120" r="150" fill="#dbeafe" opacity="0.55"/>
  <circle cx="180" cy="860" r="170" fill="#e0e7ff" opacity="0.5"/>

  <text x="100" y="92" class="h1">EasyChat · Clean Architecture</text>
  <text x="100" y="126" class="sub">WebSocket-first chat platform with strict boundaries and replaceable adapters</text>

  <rect x="970" y="64" width="150" height="34" rx="17" fill="#bfdbfe"/>
  <text x="995" y="86" class="chip">Ports &amp; Adapters</text>
  <rect x="1138" y="64" width="150" height="34" rx="17" fill="#a7f3d0"/>
  <text x="1168" y="86" class="chip">WebSocket-First</text>

  <g filter="url(#shadow)">
    <rect x="100" y="170" width="1200" height="150" rx="24" fill="url(#interfaces)"/>
    <rect x="100" y="360" width="1200" height="150" rx="24" fill="url(#application)"/>
    <rect x="100" y="550" width="1200" height="135" rx="24" fill="url(#domain)"/>
    <rect x="100" y="730" width="1200" height="150" rx="24" fill="url(#infrastructure)"/>
  </g>

  <text x="140" y="220" class="layer">Interfaces Layer</text>
  <text x="140" y="255" class="item">• HTTP: auth + chatroom endpoints, middleware, Swagger static docs</text>
  <text x="140" y="287" class="item">• WebSocket: chat events, envelope routing, connection manager, presence</text>

  <text x="140" y="410" class="layer">Application Layer</text>
  <text x="140" y="445" class="item">• Use cases: Login, Create/Get ChatRoom, SendMessage, MarkDelivered, MarkRead</text>
  <text x="140" y="477" class="item">• Services orchestrate flows and enforce business rules via domain ports</text>

  <text x="140" y="598" class="layer">Domain Layer</text>
  <text x="140" y="632" class="item">• Entities: User, ChatRoom, Message, DeliveryReceipt, ReadReceipt</text>
  <text x="140" y="662" class="item">• Repository ports: UserRepository, ChatRoomRepository, MessageRepository</text>

  <text x="140" y="780" class="layer">Infrastructure + Platform Layer</text>
  <text x="140" y="815" class="item">• Adapters: Mongo repositories, JWT provider, NATS extension hook</text>
  <text x="140" y="847" class="item">• Platform: config, logger, server wiring, graceful shutdown lifecycle</text>

  <line x1="700" y1="322" x2="700" y2="352" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="700" y1="512" x2="700" y2="542" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="700" y1="687" x2="700" y2="722" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>

  <text x="730" y="343" class="rule">interfaces call use cases</text>
  <text x="730" y="533" class="rule">application depends on domain contracts</text>
  <text x="730" y="710" class="rule">infrastructure implements domain ports</text>

  <text x="100" y="905" class="rule">Dependency rule: domain stays independent; wiring happens at the edge (main / server runtime).</text>
</svg>
