<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">EasyChat Clean Architecture Diagram</title>
  <desc id="desc">Colorful architecture diagram showing interfaces, application, domain, and infrastructure for EasyChat.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1022"/>
      <stop offset="100%" stop-color="#1a2451"/>
    </linearGradient>
    <linearGradient id="interfacesGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff8a00"/>
      <stop offset="100%" stop-color="#ff3d81"/>
    </linearGradient>
    <linearGradient id="appGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00c6ff"/>
      <stop offset="100%" stop-color="#0072ff"/>
    </linearGradient>
    <linearGradient id="domainGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7ef29d"/>
      <stop offset="100%" stop-color="#0fbf79"/>
    </linearGradient>
    <linearGradient id="infraGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#b993d6"/>
      <stop offset="100%" stop-color="#8ca6db"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#d9e3ff"/>
    </marker>
    <style>
      .title { font: 700 42px 'Segoe UI', Arial, sans-serif; fill: #ffffff; }
      .subtitle { font: 500 20px 'Segoe UI', Arial, sans-serif; fill: #c8d5ff; }
      .layer-title { font: 700 26px 'Segoe UI', Arial, sans-serif; fill: #ffffff; }
      .item { font: 600 17px 'Segoe UI', Arial, sans-serif; fill: #ffffff; }
      .small { font: 500 15px 'Segoe UI', Arial, sans-serif; fill: #e8eeff; }
      .legend { font: 600 14px 'Segoe UI', Arial, sans-serif; fill: #dce7ff; }
    </style>
  </defs>

  <rect x="0" y="0" width="1400" height="900" fill="url(#bg)"/>
  <circle cx="160" cy="140" r="120" fill="#00d4ff" opacity="0.12"/>
  <circle cx="1280" cy="780" r="180" fill="#ff4f9a" opacity="0.11"/>
  <circle cx="1160" cy="130" r="90" fill="#7ef29d" opacity="0.14"/>

  <text x="70" y="80" class="title">EasyChat · Clean Architecture</text>
  <text x="70" y="116" class="subtitle">WebSocket-first messaging platform with clear boundaries and replaceable adapters</text>

  <!-- Interfaces Layer -->
  <g filter="url(#shadow)">
    <rect x="70" y="170" rx="22" ry="22" width="1260" height="155" fill="url(#interfacesGrad)" opacity="0.96"/>
  </g>
  <text x="105" y="218" class="layer-title">Interfaces Layer</text>
  <text x="105" y="255" class="item">HTTP REST Handlers · Auth Middleware · Router · Swagger Static Hosting</text>
  <text x="105" y="288" class="item">WebSocket Handler · Connection Manager · Event Envelope Routing</text>

  <!-- Application Layer -->
  <g filter="url(#shadow)">
    <rect x="70" y="365" rx="22" ry="22" width="1260" height="155" fill="url(#appGrad)" opacity="0.96"/>
  </g>
  <text x="105" y="413" class="layer-title">Application Layer</text>
  <text x="105" y="450" class="item">Auth Service · Chat Service (Use Cases)</text>
  <text x="105" y="483" class="item">Login, Create/Get ChatRoom, Send Message, Delivery Receipt, Read Receipt, Presence</text>

  <!-- Domain Layer -->
  <g filter="url(#shadow)">
    <rect x="70" y="560" rx="22" ry="22" width="1260" height="125" fill="url(#domainGrad)" opacity="0.96"/>
  </g>
  <text x="105" y="608" class="layer-title">Domain Layer</text>
  <text x="105" y="644" class="item">Entities: User, ChatRoom, Message, DeliveryReceipt, ReadReceipt · Ports: Repositories</text>

  <!-- Infrastructure Layer -->
  <g filter="url(#shadow)">
    <rect x="70" y="725" rx="22" ry="22" width="1260" height="125" fill="url(#infraGrad)" opacity="0.96"/>
  </g>
  <text x="105" y="773" class="layer-title">Infrastructure + Platform Layer</text>
  <text x="105" y="809" class="item">MongoDB Repositories · JWT Provider · Config · Logger · Server Wiring (main.go / run.go)</text>

  <!-- dependency arrows -->
  <line x1="700" y1="325" x2="700" y2="360" stroke="#d9e3ff" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="700" y1="520" x2="700" y2="555" stroke="#d9e3ff" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="700" y1="685" x2="700" y2="720" stroke="#d9e3ff" stroke-width="4" marker-end="url(#arrow)"/>

  <text x="735" y="345" class="small">calls use cases</text>
  <text x="735" y="540" class="small">depends on domain contracts</text>
  <text x="735" y="705" class="small">implements ports</text>

  <!-- side annotations -->
  <rect x="990" y="36" width="320" height="90" rx="14" fill="#111a3a" opacity="0.9" stroke="#78a8ff"/>
  <text x="1008" y="66" class="legend">Runtime Flow</text>
  <text x="1008" y="90" class="legend">1) Login (REST) → JWT</text>
  <text x="1008" y="112" class="legend">2) Connect WS with Bearer token</text>

  <rect x="70" y="36" width="320" height="90" rx="14" fill="#111a3a" opacity="0.9" stroke="#7ef29d"/>
  <text x="88" y="66" class="legend">Data Stores</text>
  <text x="88" y="90" class="legend">users · chatrooms · messages</text>
  <text x="88" y="112" class="legend">Indexes for reference + receipts</text>
</svg>
