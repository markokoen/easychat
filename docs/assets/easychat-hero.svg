<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="360" viewBox="0 0 1400 360" role="img" aria-labelledby="t d">
  <title id="t">EasyChat Hero Banner</title>
  <desc id="d">Colorful hero banner for EasyChat repository README.</desc>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="45%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="pill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <style>
      .h { font: 800 64px 'Segoe UI', Arial, sans-serif; fill: #fff; }
      .s { font: 500 26px 'Segoe UI', Arial, sans-serif; fill: #dbeafe; }
      .c { font: 700 22px 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
    </style>
  </defs>

  <rect width="1400" height="360" rx="24" fill="url(#g)"/>
  <circle cx="1330" cy="40" r="120" fill="#ffffff" opacity="0.08"/>
  <circle cx="90" cy="330" r="140" fill="#22d3ee" opacity="0.1"/>
  <circle cx="1180" cy="280" r="90" fill="#34d399" opacity="0.11"/>

  <text x="72" y="144" class="h">EasyChat</text>
  <text x="72" y="198" class="s">WebSocket-first chat service with clean architecture and strong test coverage</text>

  <rect x="72" y="238" width="420" height="62" rx="31" fill="url(#pill)"/>
  <text x="106" y="278" class="c">REST for setup · WS for realtime events</text>
</svg>
